<!-- MathJax for LaTeX rendering: write math as \( ... \) inline or $$ ... $$ display -->
<script>
  MathJax = {
    tex: {
      inlineMath: [['\\(', '\\)']], // Use \( \) for inline math to avoid confusion with $.
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
